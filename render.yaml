services:
  - type: web
    name: nila-fieldops
    runtime: node
    plan: starter            # persistent disk needs a paid plan (Starter or higher)
    region: singapore        # closest Render region to India
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/auth/status
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.12.0
      - key: DATA_DIR
        value: /var/data
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSCODE
        sync: false          # Render will ask you for this value
    disk:
      name: fieldops-data
      mountPath: /var/data
      sizeGB: 1
